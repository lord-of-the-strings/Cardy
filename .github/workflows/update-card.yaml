name: Update Profile Cards

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Profile Card Scripts
      run: |
        python generate_codeforces_card.py
        python generate_cryptohack_card.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add codeforces_card.svg cryptohack_card.svg
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update profile tracking stats" && git push)
